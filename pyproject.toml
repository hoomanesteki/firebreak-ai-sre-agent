[project]
name = "firebreak"
version = "0.0.1"
description = "Multi-agent AI SRE that investigates incidents and cites re-runnable evidence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Hooman Esteki" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28.1",
    "pyarrow>=25.0.1",
    "duckdb>=1.5.5",
    "neo4j>=5.28",
]

[project.scripts]
firebreak = "firebreak.cli.app:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "drain3>=0.9.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firebreak", "src/firebreak_eval_labels"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
# vendor/ is the pinned OpenTelemetry Demo submodule and is never edited.
extend-exclude = ["vendor", "ops/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "C4", "PTH", "T20"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as call expressions in argument defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "T20"]
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "live: needs the live OpenTelemetry Demo stack",
    "neo4j: needs a running Neo4j (make graph-up)",
    "slow: takes more than 5 seconds",
]

[tool.coverage.run]
# scripts/ gates every commit, so it is measured too. SPEC.md Section 12
# sets the floor for src/firebreak; leaving the gatekeepers unmeasured is
# how an untested check quietly starts passing everything.
source = ["src/firebreak", "scripts"]
omit = ["src/firebreak/web/*", "src/firebreak/cli/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
