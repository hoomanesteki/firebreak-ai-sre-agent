[project]
name = "firebreak"
version = "0.0.1"
description = "Multi-agent AI SRE that investigates incidents and cites re-runnable evidence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Hooman Esteki" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28.1",
    "pyarrow>=25.0.1",
    "duckdb>=1.5.5",
    "neo4j>=5.28",
    "langgraph>=0.6",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "fastapi>=0.115",
    "jinja2>=3.1",
    # The Console is a shipped feature, so the server that runs it is a dependency of the
    # product rather than of development. It sat in `dev` until Phase 12, which meant an
    # install without dev groups had the pages and no way to serve them.
    "uvicorn>=0.34",
]

[project.scripts]
firebreak = "firebreak.cli.app:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "scikit-learn>=1.6",
    "scipy>=1.15",
]

# Kept out of `dev` because of a real conflict, not for tidiness. drain3 pins
# cachetools==4.2.1 exactly, and dspy 3, which is the first release carrying the GEPA
# optimizer SPEC.md Section 10.4 asks for, needs cachetools>=5.5. The two cannot be
# installed together.
#
# drain3 is read by exactly one script, `scripts/compare_log_templates.py`, which
# decided ADR-0006 in favour of the deterministic masker and does not ship. So it moves
# here: `uv sync --group logcompare` to re-derive that decision, and nothing else needs
# it. Resolving the conflict the other way would have meant no prompt optimization.
logcompare = [
    "drain3>=0.9.11",
]

optimize = [
    "dspy>=3.0",
]

# uv resolves every group into one environment unless told they conflict, so putting
# drain3 and dspy in separate groups was not enough on its own. Declared here, which
# is what makes `uv sync --group optimize` and `uv sync --group logcompare` two
# different environments rather than an unsatisfiable one.
[tool.uv]
conflicts = [
    [
        { group = "logcompare" },
        { group = "optimize" },
    ],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firebreak", "src/firebreak_eval_labels"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
# vendor/ is the pinned OpenTelemetry Demo submodule and is never edited.
extend-exclude = ["vendor", "ops/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "C4", "PTH", "T20"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as call expressions in argument defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "T20"]
# Both are commands a person runs and reads the output of, so they print. The rule stays
# on for `src/`, where it is right: library code that prints cannot be embedded.
"scripts/**" = ["T20"]
"site/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "site"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# dspy ships no py.typed marker. It is an optional dependency read only by
# src/firebreak/optimize/gepa.py, and only inside the one function that calls GEPA, so
# the untyped surface is bounded to that call rather than reaching the product.
module = ["dspy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# drain3 ships no type information. It is a dev dependency read only by
# scripts/compare_log_templates.py, which decided ADR-0006 and does not ship,
# so the untyped surface never reaches the product.
module = ["drain3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "live: needs the live OpenTelemetry Demo stack",
    "neo4j: needs a running Neo4j (make graph-up)",
    "slow: takes more than 5 seconds",
]

[tool.coverage.run]
# scripts/ gates every commit, so it is measured too. SPEC.md Section 12
# sets the floor for src/firebreak; leaving the gatekeepers unmeasured is
# how an untested check quietly starts passing everything.
source = ["src/firebreak", "scripts"]
omit = ["src/firebreak/web/*", "src/firebreak/cli/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
