[project]
name = "firebreak"
version = "0.0.1"
description = "Multi-agent AI SRE that investigates incidents and cites re-runnable evidence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Hooman Esteki" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
firebreak = "firebreak.cli.app:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firebreak"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "C4", "PTH", "T20"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "T20"]
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "live: needs the live OpenTelemetry Demo stack",
    "slow: takes more than 5 seconds",
]

[tool.coverage.run]
source = ["src/firebreak"]
omit = ["src/firebreak/web/*", "src/firebreak/cli/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
