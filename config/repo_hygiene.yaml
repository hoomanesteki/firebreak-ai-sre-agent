# Rules enforced by scripts/check_repo_hygiene.py and
# scripts/hooks/check_commit_msg.py. See SPEC.md Section 19.4.

allowed_author_emails:
  - esteki.net@gmail.com
  # The owner's GitHub noreply address, on commits made in the web UI.
  - 67445158+hoomanesteki@users.noreply.github.com

# Characters banned everywhere in tracked text files.
banned_characters:
  - "\u2014"  # em dash
  - "\u2013"  # en dash

# Paths excluded from character and word checks.
excluded_paths:
  - vendor/
  - bundles/
  - labels/
  - recordings/
  - reports/
  - uv.lock
  - src/firebreak/web/static/vendor/
  - site/static/vendor/

# Extensions treated as text and scanned for banned characters.
text_extensions:
  - .md
  - .py
  - .yaml
  - .yml
  - .toml
  - .json
  - .cfg
  - .ini
  - .txt
  - .html
  - .css
  - .js
  - .cypher
  - .sql
  # Added in Phase 12 with the Quarto explainer. Their absence was a real gap rather than an
  # oversight worth shrugging at: the check reported "clean" over five published pages that
  # contained en dashes, which a test in tests/unit/test_explainer_site.py caught instead.
  # tests/unit/test_hygiene_covers_the_repository.py now fails when a new text type appears
  # here and is not listed, so the next one cannot slip through the same way.
  - .qmd
  - .scss
  - .sh

# Filler and marketing words banned in prose files.
flagged_words:
  - delve
  - seamless
  - seamlessly
  - cutting-edge
  - state-of-the-art
  - game-changer
  - revolutionize
  - unlock
  - unleash
  - harness the power
  - supercharge
  - elevate
  - empower
  - leverage
  - utilize
  - in today's fast-paced
  - it's worth noting
  - it is important to note
  - plays a crucial role
  - a testament to
  - navigate the complexities
  - embark
  - journey
  - tapestry
  - realm
  - moreover
  - furthermore

# Files scanned for flagged words (glob patterns, relative to repo root).
prose_globs:
  - README.md
  - docs/**/*.md
  - site/templates/**

# Patterns that mark a commit as AI-attributed. Case insensitive.
ai_attribution_patterns:
  - "co-authored-by:.*(claude|anthropic|gpt|openai|copilot|codex|gemini|cursor)"
  - "generated with"
  - "noreply@anthropic\\.com"
  - "\U0001F916"

# Conventional Commits settings for the commit-msg hook.
commit_types:
  - feat
  - fix
  - refactor
  - perf
  - test
  - docs
  - build
  - ci
  - chore
commit_subject_max_length: 72

# Allowed commit scopes. A scope is optional; when present it must be
# in this list. See SPEC.md Section 18.3.
commit_scopes:
  - lab
  - bundles
  - backends
  - tools
  - graph
  - triage
  - agent
  - critic
  - gates
  - cascade
  - approvals
  - feedback
  - optimize
  - evals
  - security
  - telemetry
  - web
  - site
  - ops
  - deps
  - repo
