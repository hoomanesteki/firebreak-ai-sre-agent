# Install with: uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        # Check only. A hook that rewrites files mid-commit fights partial
        # staging; run make format to apply fixes.
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: repo-hygiene
        name: repo hygiene
        entry: uv run python scripts/check_repo_hygiene.py --skip-git
        language: system
        pass_filenames: true
        require_serial: true

      - id: leakage
        name: ground truth leakage
        entry: uv run python scripts/check_leakage.py
        language: system
        pass_filenames: false
        require_serial: true

      - id: commit-msg-check
        name: commit message check
        entry: uv run python scripts/hooks/check_commit_msg.py
        language: system
        stages: [commit-msg]
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
        # ops/compose.live.yml uses Compose's !override merge tag, which a
        # plain safe_load cannot resolve. tests/unit/test_ops_overlays.py
        # parses that file with a tag tolerant loader and checks its contents.
        exclude: ^ops/compose\.live\.yml$
      - id: check-toml
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
