name: ci

on:
  push:
    branches: [main, "feat/**", "chore/**", "fix/**", "ci/**", "docs/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The suite takes about two minutes. Twenty is generous for a cold cache and
    # far short of the six hour default, which a hung test would otherwise burn.
    timeout-minutes: 20

    services:
      # Without this the Neo4j integration tests skip, and skipping is the
      # failure mode worth guarding against: the Cypher would be verified only
      # on whichever machine happened to have a database running. SPEC.md rule
      # 3 says an API is confirmed rather than assumed, and Cypher is an API.
      #
      # Pinned to the same patch release as ops/compose.core.yml, so CI and a
      # developer's machine are testing against one engine.
      neo4j:
        image: neo4j:5.26.1-community
        env:
          NEO4J_AUTH: neo4j/firebreak-local
        ports:
          - 7687:7687
        # Asks the database a question rather than checking that a port is
        # open. Neo4j accepts connections well before it will answer queries,
        # and a test starting in that gap fails with an error that looks like a
        # bug in the code under test.
        options: >-
          --health-cmd "cypher-shell -u neo4j -p firebreak-local 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 40s

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The overlay drift tests and the flag inventory read the pinned
          # demo's own files, which is the point: they fail when the pin moves
          # and something upstream changed underneath us.
          submodules: true

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        # Every platform, not just the runner's. mypy narrows sys.platform to
        # the platform it checks for, so code behind a platform guard is only
        # half checked by one run, and whichever half is dead becomes a
        # warn_unreachable error on the other platform. A darwin-only local run
        # passed while this step failed on Linux.
        run: |
          uv run mypy --platform darwin src scripts
          uv run mypy --platform linux src scripts
          uv run mypy --platform win32 src scripts

      - name: Test
        # FIREBREAK_REQUIRE_NEO4J turns the integration tests' skip into a
        # failure. A skipped suite and a passing one look identical in a
        # summary line, so without this a broken service would quietly reduce
        # what CI covers rather than failing.
        env:
          FIREBREAK_REQUIRE_NEO4J: "1"
        run: uv run pytest --cov --cov-report=term-missing

      - name: Ground truth leakage
        run: uv run python scripts/check_leakage.py

      - name: Repository hygiene
        run: |
          git fetch origin main --depth=50 || true
          uv run python scripts/check_repo_hygiene.py --base-ref origin/main

      - name: Offline demo
        # CLAUDE.md requires this green from Phase 11. It replays recorded model answers
        # against frozen bundles and compares the result with what was recorded, so a
        # failure here means the harness became nondeterministic, which would make every
        # measurement in every report suspect.
        env:
          PYTHONPATH: src
        run: uv run python scripts/demo_offline.py

      - name: Spec conformance
        # Reads SPEC.md's own tables and fails when a completed phase left
        # something out. It found two on the day it was written: an ablation no
        # phase claimed, and a make target CLAUDE.md promised and nobody had
        # added. Planned work is reported and does not fail, because a checker
        # that failed on the plan would have to be silenced.
        env:
          PYTHONPATH: src
        run: uv run python scripts/check_spec_conformance.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Audited in two passes, because --all-groups cannot resolve conflicting groups
      # and because the two passes answer different questions.
      #
      # The first pass covers what ships and what CI installs, and it allows no
      # exceptions. The second covers the optional developer-only groups, where one
      # unfixable advisory is ignored by id with the reasoning below.
      - name: Audit what ships and what CI installs
        run: |
          set -euo pipefail
          uv export --format requirements-txt --no-hashes --group dev \
            > requirements-audit.txt
          uvx pip-audit --requirement requirements-audit.txt

      - name: Audit the optional developer groups
        # PYSEC-2026-2447 in diskcache 5.6.3 is ignored here, and only here.
        #
        # There is no version that avoids it: 5.6.3 is the newest release diskcache has,
        # the advisory lists no fix, and dspy requires diskcache>=5.6.0. So the choice is
        # between having prompt optimization and not having it.
        #
        # **The advisory has not been assessed.** What bounds the exposure is where the
        # group is installed: `optimize` is never in the wheel, never installed by CI,
        # and reached only when a developer runs `uv sync --group optimize` to optimize
        # prompts offline. Nothing in production or in any published number depends on it.
        #
        # This is a policy choice and it is the owner's to reverse. Removing the ignore
        # makes this step fail until diskcache ships a fix; removing the `optimize` group
        # removes prompt optimization. docs/threat-model.md records it.
        run: |
          set -euo pipefail
          for extra in "--group optimize" "--group logcompare"; do
            echo "::group::auditing dev ${extra}"
            uv export --format requirements-txt --no-hashes --group dev ${extra} \
              > requirements-audit.txt
            uvx pip-audit --requirement requirements-audit.txt \
              --ignore-vuln PYSEC-2026-2447
            echo "::endgroup::"
          done

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
