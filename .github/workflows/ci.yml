name: ci

on:
  push:
    branches: [main, "feat/**", "chore/**", "fix/**", "ci/**", "docs/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src scripts

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

      - name: Repository hygiene
        run: |
          git fetch origin main --depth=50 || true
          uv run python scripts/check_repo_hygiene.py --base-ref origin/main

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Audit dependencies
        run: |
          uv export --format requirements-txt --no-hashes --all-groups > requirements-audit.txt
          uvx pip-audit --requirement requirements-audit.txt

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
